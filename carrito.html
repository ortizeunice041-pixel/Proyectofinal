<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras</title>
  <link rel="stylesheet" href="css/carrito.css">
  <link rel="stylesheet" href="lib/fontawesome/css/all.min.css">
</head>
<body>
  <header>
    <div class="header__superior">
        <div class="logo">
            <img src="images/logotipo.svg" alt="">
        </div>
        <div class="search">
            <input type="search" placeholder="¿Que deseas buscar ?">
        </div>
      </div>

      <div class="container__menu">

        <div class="menu">
            <input type="checkbox" id="check__menu">
            <label id="label__check" for="check__menu">
                 <img  src="images/icon (2).svg" class="icon__menu"></img>
            </label>
            <nav>
                <ul>
                    <li><a href="index.html" id="selected"></a></li>
                    <li><a href="#">Catalogo</a>
                        <ul>
                            <li><a href="catalogomujer.html">Mujer</a></li>
                            <li><a href="#">Hombre</a></li>
                            <li><a href="#">Niños</a></li>
                        </ul>
                    </li>
                    <li><a href="comprayventa.html">Compra y venta</a></li>
                    <li><a href="carrito">Carrito</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
      </div>
  </header>

  <!-- ================= CONTENIDO DEL CARRITO ================= -->
  <main class="carrito-page">
    <h1>🛒 Tu Carrito</h1>
    <div class="carrito-container" id="carritoContainer">
      <p>El carrito está vacío.</p>
    </div>
    <div class="carrito-total">
      <strong>Total: $<span id="cartTotal">0.00</span></strong>
      <button id="vaciarCarrito">Vaciar Carrito</button>
      <button id="checkout">Finalizar Compra</button>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    <div class="container">
      <div class="footer-row">
        <div class="footer-links">
          <h4>ClothesShop</h4>
          <ul>
            <li><a href="#">WhatsApp</a></li>
            <li><a href="#">Email</a></li>
            <li><a href="#">Dirección</a></li>
          </ul>
        </div>

        <div class="footer-links">
          <h4>Ayuda</h4>
          <ul>
            <li><a href="#">Preguntas</a></li>
            <li><a href="#">Compras</a></li>
            <li><a href="#">Envios</a></li>
          </ul>
        </div>

        <div class="footer-links">
          <h4>Tienda</h4>
          <ul>
            <li><a href="#">Ropa</a></li>
            <li><a href="#">Comodidad</a></li>
            <li><a href="#">Estilos</a></li>
          </ul>
        </div>

        <div class="footer-links">
          <h4>Síguenos</h4>
          <div class="social-link">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script src="lib/fontawesome/js/all.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
